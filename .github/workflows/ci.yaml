name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.10.7"

      - name: Install dependencies
        run: dart pub get

      - name: Check formatting
        run: dart format --output=none --set-exit-if-changed .

      - name: Analyze
        run: dart analyze --fatal-infos

  changes:
    runs-on: ubuntu-latest
    outputs:
      spark: ${{ steps.filter.outputs.spark }}
      spark_cli: ${{ steps.filter.outputs.spark_cli }}
      spark_css: ${{ steps.filter.outputs.spark_css }}
      spark_generator: ${{ steps.filter.outputs.spark_generator }}
      spark_html_dsl: ${{ steps.filter.outputs.spark_html_dsl }}
      spark_vdom: ${{ steps.filter.outputs.spark_vdom }}
      spark_web: ${{ steps.filter.outputs.spark_web }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            spark_css:
              - 'packages/spark_css/**'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yaml'
            spark_html_dsl:
              - 'packages/spark_html_dsl/**'
              - 'packages/spark_web/**'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yaml'
            spark_vdom:
              - 'packages/spark_vdom/**'
              - 'packages/spark_html_dsl/**'
              - 'packages/spark_web/**'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yaml'
            spark:
              - 'packages/spark/**'
              - 'packages/spark_css/**'
              - 'packages/spark_html_dsl/**'
              - 'packages/spark_vdom/**'
              - 'packages/spark_web/**'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yaml'
            spark_cli:
              - 'packages/spark_cli/**'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yaml'
            spark_web:
              - 'packages/spark_web/**'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yaml'
            spark_generator:
              - 'packages/spark_generator/**'
              - 'packages/spark/**'
              - 'packages/spark_css/**'
              - 'packages/spark_html_dsl/**'
              - 'packages/spark_vdom/**'
              - 'packages/spark_web/**'
              - 'pubspec.yaml'
              - '.github/workflows/ci.yaml'

  test_spark:
    needs: changes
    if: ${{ needs.changes.outputs.spark == 'true' }}
    name: Test Spark
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
        with:
          sdk: "3.10.7"

      - uses: browser-actions/setup-chrome@v1

      - name: Install dependencies
        run: dart pub get

      - name: Install coverage tool
        run: dart pub global activate coverage

      - name: Run tests
        run: |
          cd packages/spark
          dart test --coverage=coverage
          dart test -p chrome --coverage=coverage
          dart pub global run coverage:format_coverage --lcov --in=coverage --out=coverage/lcov.info --packages=../../.dart_tool/package_config.json --report-on=lib

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: packages/spark/coverage/lcov.info
          flags: spark_framework

  test_spark_css:
    needs: changes
    if: ${{ needs.changes.outputs.spark_css == 'true' }}
    name: Test Spark CSS
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dart-lang/setup-dart@v1
